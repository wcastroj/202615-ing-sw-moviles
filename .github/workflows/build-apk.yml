name: Build APK

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug -PBACKEND_URL="${{ vars.BACKEND_URL }}" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "Vivo_Sonika_release_${{ github.run_number  }}"
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
